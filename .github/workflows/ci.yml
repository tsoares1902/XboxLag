name: Quality and security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, format and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore with NuGet Audit
        run: dotnet restore XboxLag.slnx --locked-mode
      - name: Build Release with Roslyn analyzers
        run: dotnet build XboxLag.slnx -c Release --no-restore
      - name: Verify formatting
        run: dotnet format XboxLag.slnx --verify-no-changes --no-restore
      - name: Tests and Cobertura coverage
        run: dotnet test XboxLag.slnx -c Release --no-build --no-restore --collect:"XPlat Code Coverage" --settings coverage.runsettings --results-directory artifacts/test-results --logger trx
      - name: Upload test results and coverage when present
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-and-coverage
          path: artifacts/test-results/
          if-no-files-found: warn
          retention-days: 14

  semgrep:
    name: Semgrep OSS
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned Semgrep OSS from PyPI
        run: python -m pip install semgrep==1.182.1
      - name: Scan C# using versioned rules
        run: semgrep scan --config .semgrep/csharp.yml --error --strict --metrics=off --disable-version-check .

  trivy:
    name: Trivy filesystem security
    needs: semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Trivy with release checksum verification
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.1
          cache: false
      - name: Update vulnerability database
        run: trivy image --download-db-only
      - name: Scan dependencies, configuration and secrets
        run: trivy fs --config trivy.yaml .
